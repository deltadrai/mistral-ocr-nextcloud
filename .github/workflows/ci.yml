name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; the docker job opts into packages: write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/deltadrai/mistral-ocr-nextcloud

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q

  manifest:
    name: Validate appinfo/info.xml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Same schema + pre-transform the Nextcloud App Store applies, plus the
      # AppAPI-only route checks the store strips before validating.
      - run: python scripts/validate_info_xml.py
      - name: Release tag must match <version>
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('appinfo/info.xml').getroot().findtext('version'))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match <version> $version in appinfo/info.xml"
            exit 1
          fi

  js-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # AppAPI injects the Files-page script and the settings-page bundle as classic
      # scripts/styles, so js/files_action.js, js/admin_page.js and css/admin.css are
      # committed. Fail if any of them no longer matches its source.
      - run: npm run build
      - run: git diff --exit-code js/files_action.js js/admin_page.js css/admin.css

  docker:
    runs-on: ubuntu-latest
    needs: [lint-test, manifest, js-bundle]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: version
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('appinfo/info.xml').getroot().findtext('version'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Build the amd64 image locally first so the release artifact is actually
      # exercised: a manifest that validates but a container that cannot boot is
      # still a broken release.
      - name: Build image (amd64, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mistral-ocr-nextcloud:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name exapp-smoke -p 9000:9000 mistral-ocr-nextcloud:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/api/v1/health; then
              echo "health endpoint is up"
              docker rm -f exapp-smoke
              exit 0
            fi
            sleep 1
          done
          echo "::error::the container never answered /api/v1/health"
          docker logs exapp-smoke
          docker rm -f exapp-smoke
          exit 1

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # A released image tag must be immutable: <version> is only pushed for a
          # v* tag, never for a branch push. Otherwise merging to main would overwrite
          # the image that info.xml and the app store pin. :latest tracks main only.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY' > release-notes.md
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # Stop at the next release heading or at the link-reference block.
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[|\Z)",
              text,
              flags=re.MULTILINE | re.DOTALL,
          )
          if not match:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          print(match.group(1).strip())
          PY
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Mistral OCR $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
