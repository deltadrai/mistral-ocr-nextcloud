[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicit scope keeps pytest-asyncio from warning on every run.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mistral_ocr"]
